name: Verify U Use
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uuse_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: uuse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uuse_test -d uuse_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: xjtlu-market-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: xjtlu-market-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://uuse_test:local-ci-only@127.0.0.1:5432/uuse_test
      - run: npm run build
      - run: npm run test:api
      - run: npm audit --audit-level=high
